<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolFix Login</title><style>body{font-family:system-ui;background:#f8fafc;color:#0f172a}.box{max-width:450px;margin:8vh auto;background:#fff;padding:35px;border-radius:20px;border:1px solid #e2e8f0}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 16px;border:1px solid #cbd5e1;border-radius:10px}button{padding:12px 18px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-weight:700;width:100%}.roles{display:flex;gap:25px;margin:10px 0 20px}.roles input{width:auto}.error{color:#b91c1c;background:#fef2f2;padding:10px;border-radius:8px}a{color:#2563eb}</style></head><body><div class="box"><h1>SchoolFix</h1><h2>Login</h2>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="POST"><label>Username</label><input name="username" required><label>Password</label><input type="password" name="password" required><b>Login as</b><div class="roles"><label><input type="radio" name="login_type" value="student" required> Student</label><label><input type="radio" name="login_type" value="admin"> Admin</label></div><button>Login</button></form><p><a href="/register">Create student account</a> · <a href="/">Home</a></p></div></body></html>
