<!doctype html><html><body style="font-family:system-ui;background:#f8fafc"><div style="max-width:950px;margin:4vh auto"><h1>School Reports</h1>{% for r in reports %}<div style="background:white;border:1px solid #e2e8f0;padding:20px;border-radius:15px;margin:15px 0"><h3>#{{r[0]}} · {{r[2]}} · {{r[5]}}</h3><p><b>Student:</b> {{r[1]}}</p><p><b>Location:</b> {{r[3]}}</p><p>{{r[4]}}</p>{% if r[7] %}<p><b>Admin note:</b> {{r[7]}}</p>{% endif %}<form method="POST" action="/update-report/{{r[0]}}"><select name="status"><option>Pending</option><option>In Progress</option><option>Resolved</option></select><textarea name="admin_note" placeholder="Admin note" style="display:block;width:100%;margin:10px 0;box-sizing:border-box"></textarea><button>Update</button></form><form method="POST" action="/unreasonable/{{r[0]}}"><input name="admin_note" placeholder="Reason"><button>Mark Unreasonable</button></form>{% if session['role']=='main_admin' %}<form method="POST" action="/delete-report/{{r[0]}}"><button>Delete</button></form>{% endif %}</div>{% else %}<p>No reports.</p>{% endfor %}<a href="/dashboard">Back</a></div></body></html>
