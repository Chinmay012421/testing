<!doctype html><html><body style="font-family:system-ui;background:#f8fafc"><div style="max-width:900px;margin:4vh auto"><h1>Unreasonable Reports</h1>{% for r in reports %}<div style="background:white;padding:20px;border-radius:15px;margin:15px 0"><h3>#{{r[0]}} · {{r[2]}}</h3><p>{{r[4]}}</p><p>Admin note: {{r[7]}}</p><form method="POST" action="/update-report/{{r[0]}}"><select name="status"><option>Pending</option><option>In Progress</option><option>Resolved</option></select><textarea name="admin_note" placeholder="Main Admin note" style="display:block;width:100%;margin:10px 0;box-sizing:border-box"></textarea><button>Review Complaint</button></form></div>{% else %}<p>No unreasonable complaints.</p>{% endfor %}<a href="/dashboard">Back</a></div></body></html>
