<!doctype html><html><body style="font-family:system-ui;background:#f8fafc"><div style="max-width:900px;margin:4vh auto"><h1>My Reports</h1><div style="background:white;padding:22px;border-radius:16px"><form method="POST" action="/submit-report"><select name="category" required><option>Academics</option><option>Infrastructure</option><option>Cleanliness</option><option>Canteen</option><option>Sports</option><option>Transport</option><option>School Events</option><option>Safety</option><option>Other</option></select><input name="location" required placeholder="Location" style="display:block;margin:12px 0;width:100%;box-sizing:border-box;padding:10px"><textarea name="message" required placeholder="Describe the problem" style="width:100%;min-height:120px;box-sizing:border-box"></textarea><br><button style="margin-top:12px;padding:11px 16px">Submit Complaint</button></form></div><h2>Previous Reports</h2>{% for r in reports %}<div style="background:white;padding:18px;border-radius:14px;margin:12px 0"><h3>#{{r[0]}} · {{r[2]}}{% if r[12] %} · {{r[12]}}{% endif %}</h3><p>{{r[4]}}</p><p>Status: <b>{{r[5]}}</b> · Location: {{r[3]}} · Priority: {{r[11]}}</p>{% if r[7] %}<p>Admin note: {{r[7]}}</p>{% endif %}</div>{% else %}<p>No reports yet.</p>{% endfor %}<a href="/dashboard">Back</a></div></body></html>
