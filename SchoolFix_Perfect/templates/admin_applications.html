<!doctype html><html><body style="font-family:system-ui;background:#f8fafc"><div style="max-width:900px;margin:4vh auto"><h1>Admin Applications</h1>{% for a in applications %}<div style="background:white;border:1px solid #e2e8f0;padding:20px;border-radius:15px;margin:15px 0"><h3>#{{a[0]}} · {{a[1]}}</h3><p>{{a[2]}}</p><p>Status: <b>{{a[3]}}</b> · {{a[4]}}</p>{% if a[3]=='Pending' %}<form method="POST" action="/approve-admin/{{a[0]}}" style="display:inline"><button>Approve</button></form> <form method="POST" action="/reject-admin/{{a[0]}}" style="display:inline"><button>Reject</button></form>{% endif %}</div>{% else %}<p>No applications.</p>{% endfor %}<a href="/dashboard">Back</a></div></body></html>
